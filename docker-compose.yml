# Sobe o ambiente completo: SQL Server + gateway de pagamento simulado + API.
#   docker compose up -d --build
# API (Scalar/OpenAPI): http://localhost:5000/scalar/v1
# Os valores padrão abaixo são APENAS para desenvolvimento. Em produção, use variáveis de ambiente/cofre de segredos.
name: raizes-do-nordeste

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:-Raizes_Dev_2026!}
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  gateway:
    build:
      context: .
      dockerfile: src/PaymentGateway.Mock/Dockerfile
    environment:
      Gateway__ApiKey: ${GATEWAY_API_KEY:-gateway-dev-api-key}
      Gateway__SegredoWebhook: ${WEBHOOK_SECRET:-segredo-webhook-desenvolvimento}
      Gateway__AtrasoWebhookMs: "800"
    ports:
      - "5100:8080"

  api:
    build:
      context: .
      dockerfile: src/RaizesDoNordeste.Api/Dockerfile
    depends_on:
      sqlserver:
        condition: service_healthy
      gateway:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__SqlServer: "Server=sqlserver,1433;Database=RaizesDoNordeste;User Id=sa;Password=${SQL_SA_PASSWORD:-Raizes_Dev_2026!};TrustServerCertificate=True;Encrypt=True"
      Jwt__Chave: ${JWT_KEY:-chave-de-desenvolvimento-docker-nao-usar-em-producao-123}
      GatewayPagamento__BaseUrl: http://gateway:8080/
      GatewayPagamento__UrlCallback: http://api:8080/api/v1/webhooks/pagamentos
      GatewayPagamento__ApiKey: ${GATEWAY_API_KEY:-gateway-dev-api-key}
      GatewayPagamento__SegredoWebhook: ${WEBHOOK_SECRET:-segredo-webhook-desenvolvimento}
      Seed__AdminEmail: ${ADMIN_EMAIL:-admin@raizes.com.br}
      Seed__AdminSenha: ${ADMIN_PASSWORD:-Raizes@2026}
      Seed__DadosDemonstracao: "true"
      Documentacao__Habilitada: "true"
      RateLimit__RequisicoesPorJanela: ${RATE_LIMIT:-200}
    ports:
      - "5000:8080"

volumes:
  sqldata:
